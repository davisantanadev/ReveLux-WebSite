<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel Rêve Lux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
<script>try{var t=localStorage.getItem('rl-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body class="admin">

<!-- Login -->
<section class="login" id="login-view">
  <form class="login__card" id="login-form" novalidate>
    <span class="brand"><span class="brand__name">Rêve Lux</span><svg class="brand__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.5 4.6 2.6 7.6 8.5 9.5-5.9 1.9-8 4.9-8.5 9.5-.5-4.6-2.6-7.6-8.5-9.5 5.9-1.9 8-4.9 8.5-9.5z"/></svg></span>
    <p class="eyebrow">Área do lojista</p>
    <label class="field"><span>E-mail</span><input id="login-email" type="email" autocomplete="username" required></label>
    <label class="field"><span>Senha</span><input id="login-pass" type="password" autocomplete="current-password" required></label>
    <p class="form-error" id="login-error" role="alert"></p>
    <button class="btn btn--primary btn--block">Entrar</button>
    <p class="muted login__hint" id="login-hint"></p>
    <a class="link" href="index.html">← Voltar para a loja</a>
  </form>
</section>

<!-- Painel -->
<div class="panel" id="panel-view" hidden>
  <header class="panel__top">
    <a href="index.html" class="brand"><span class="brand__name">Rêve Lux</span><svg class="brand__star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.5 4.6 2.6 7.6 8.5 9.5-5.9 1.9-8 4.9-8.5 9.5-.5-4.6-2.6-7.6-8.5-9.5 5.9-1.9 8-4.9 8.5-9.5z"/></svg></a>
    <span class="mode" id="mode"></span>
    <div class="panel__actions">
      <button class="icon-btn theme-toggle" aria-label="Alternar tema claro/escuro">
        <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
      <button class="btn btn--ghost btn--sm" id="logout">Sair</button>
    </div>
  </header>

  <main class="panel__main">
    <div class="panel__head">
      <div><p class="eyebrow">Catálogo</p><h1>Produtos</h1></div>
      <button class="btn btn--primary" id="new-btn">+ Novo produto</button>
    </div>

    <div class="stats" id="stats"></div>

    <div class="toolbar">
      <input type="search" id="filter" placeholder="Buscar por nome…" aria-label="Buscar produtos">
      <select id="filter-cat" aria-label="Filtrar por categoria"><option value="">Todas as categorias</option></select>
      <button class="btn btn--ghost btn--sm" id="reset-demo" hidden>Restaurar catálogo de exemplo</button>
    </div>

    <div class="table-wrap">
      <table class="table">
        <thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Status</th><th><span class="sr-only">Ações</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Editor -->
<aside class="drawer" id="editor" aria-hidden="true">
  <form class="drawer__panel editor" id="form" novalidate>
    <button type="button" class="icon-btn drawer__close" aria-label="Fechar">✕</button>
    <h3 id="form-title">Novo produto</h3>

    <div class="editor__body">
      <label class="field"><span>Nome *</span><input id="f-name" required maxlength="120"></label>
      <div class="row2">
        <label class="field"><span>Categoria *</span><select id="f-category" required></select></label>
        <label class="field"><span>Selo</span><input id="f-tag" placeholder="Ex.: Novo, Últimas peças" maxlength="30"></label>
      </div>
      <div class="row3">
        <label class="field"><span>Preço (R$) *</span><input id="f-price" type="number" step="0.01" min="0" required></label>
        <label class="field"><span>Preço "de" (R$)</span><input id="f-compare" type="number" step="0.01" min="0" placeholder="Opcional"></label>
        <label class="field"><span>Estoque</span><input id="f-stock" type="number" step="1" min="0" value="0"></label>
      </div>

      <fieldset class="field">
        <legend>Fotos</legend>
        <div class="imgs" id="f-images"></div>
        <div class="imgs__add">
          <label class="btn btn--ghost btn--sm"><input type="file" id="f-upload" accept="image/*" multiple hidden>Enviar fotos</label>
          <input id="f-image-url" type="url" placeholder="ou cole o link de uma imagem">
          <button type="button" class="btn btn--ghost btn--sm" id="f-add-url">Adicionar</button>
        </div>
        <small class="muted">A primeira foto é a capa. Use fotos em 3:4 (ex.: 1200 × 1600 px).</small>
      </fieldset>

      <fieldset class="field">
        <legend>Cores</legend>
        <div id="f-colors" class="colors"></div>
        <button type="button" class="btn btn--ghost btn--sm" id="f-add-color">+ Cor</button>
      </fieldset>

      <label class="field"><span>Tamanhos (separados por vírgula)</span><input id="f-sizes" placeholder="PP, P, M, G, GG"></label>
      <label class="field"><span>Descrição</span><textarea id="f-description" rows="4" maxlength="2000"></textarea></label>
      <label class="field"><span>Detalhes (um por linha)</span><textarea id="f-details" rows="4" placeholder="Tecido: linho&#10;Lavar à mão"></textarea></label>

      <div class="toggles">
        <label><input type="checkbox" id="f-active" checked> Visível na loja</label>
        <label><input type="checkbox" id="f-new"> Mostrar em Novidades</label>
        <label><input type="checkbox" id="f-best"> Mostrar em Mais vendidos</label>
      </div>
      <p class="form-error" id="form-error" role="alert"></p>
    </div>

    <div class="editor__foot">
      <button type="button" class="btn btn--ghost" id="delete-btn" hidden>Excluir</button>
      <span class="confirm" id="confirm" hidden>Excluir mesmo? <button type="button" class="link" id="confirm-yes">Sim, excluir</button> <button type="button" class="link" id="confirm-no">Cancelar</button></span>
      <button class="btn btn--primary" id="save-btn">Salvar produto</button>
    </div>
  </form>
</aside>

<div class="toast" id="toast" role="status"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>

<html><head><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Jost:wght@400&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1080px;height:1080px;display:grid;place-items:center;background:
radial-gradient(70% 60% at 35% 25%,#fbf6f1 0%,transparent 70%),radial-gradient(80% 80% at 70% 85%,#e6d3c6 0%,transparent 70%),#f1e7e0;font-family:Jost}
.wrap{position:relative;display:flex;flex-direction:column;align-items:center}

.tag{margin-top:40px;letter-spacing:.42em;font-size:24px;color:#8a6a5c}
